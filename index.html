<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Gussing Game</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <main class="game-card">
        <h1 class="game-card-title">Number Gussing Game</h1>
        <p class="game-card-subtitle">Guess a number between 1 and 10 using the browser prompt!</p>
        
        <button class="game-card-btn" onclick="guessNumber()">Start Game</button>

        <div id="logContainer" class="game-card-log"></div>
    </main>

    <script src="script/script.js"></script>
</body>
</html>
